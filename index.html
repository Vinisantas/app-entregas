<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚴 Entregas Camaquã - Premium</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* ==================== CSS COMPLETO ==================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: #0a0a0a; 
            color: #e0e0e0; 
            padding: 10px; 
            min-height: 100vh;
            transition: background 0.3s;
        }
        
        /* Modo Noturno Ultra Escuro */
        body.dark-mode {
            background: #050505;
        }
        
        body.dark-mode .container { background: #0a0a0a; }
        body.dark-mode .stat-card { background: #111; border-color: #1a1a1a; }
        body.dark-mode .form-group { background: #111; }
        body.dark-mode .lista-container { background: #111; }
        body.dark-mode .item-entrega { background: #1a1a1a; }
        body.dark-mode .modal-content { background: #0a0a0a; }
        body.dark-mode .ponto-partida { background: #111; border-color: #ff6b35; }
        body.dark-mode .rota-info { background: #111; border-color: #1a1a1a; }
        
        .container { max-width: 500px; margin: 0 auto; background: #0d0d0d; padding: 10px; border-radius: 16px; }
        
        /* Header */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 2px solid #1a1a1a; }
        header h1 { font-size: 18px; color: #ff6b35; }
        .status { font-size: 9px; padding: 3px 8px; border-radius: 20px; background: #1a1a1a; }
        .status.online { background: #1b5e20; color: #81c784; }
        .status.offline { background: #4a1a1a; color: #ef9a9a; }
        
        /* Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 8px; }
        .stat-card { background: #111; padding: 6px 2px; border-radius: 8px; text-align: center; border: 1px solid #1a1a1a; }
        .stat-number { display: block; font-size: 18px; font-weight: bold; color: #ff6b35; }
        .stat-label { font-size: 8px; color: #666; text-transform: uppercase; }
        
        /* Ponto de Partida */
        .ponto-partida { background: #111; padding: 8px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #ff6b35; }
        .ponto-partida label { font-size: 10px; color: #ff6b35; display: block; margin-bottom: 3px; }
        .ponto-partida .input-row { display: flex; gap: 4px; }
        .ponto-partida input { flex: 1; padding: 6px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 4px; color: #fff; font-size: 11px; }
        .ponto-partida .btn-set { padding: 6px 12px; background: #ff6b35; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; font-size: 10px; }
        
        /* Total Ganho */
        .total-ganho { background: #111; padding: 6px; border-radius: 8px; text-align: center; margin-bottom: 8px; border: 1px solid #1a1a1a; }
        .total-ganho span { font-size: 18px; font-weight: bold; color: #ffd700; }
        
        /* Formulário */
        .form-group { background: #111; padding: 8px; border-radius: 10px; margin-bottom: 8px; }
        .input-row { display: flex; gap: 4px; margin-bottom: 4px; flex-wrap: wrap; }
        .input-rua { flex: 2; padding: 6px 8px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 4px; color: #fff; font-size: 12px; min-width: 80px; }
        .input-numero { flex: 1; padding: 6px 8px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 4px; color: #fff; font-size: 12px; min-width: 50px; }
        .input-cliente { flex: 1; padding: 6px 8px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 4px; color: #fff; font-size: 12px; min-width: 60px; }
        .input-valor { width: 60px; padding: 6px 8px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 4px; color: #fff; font-size: 12px; }
        .btn-add { padding: 6px 14px; background: #4CAF50; border: none; border-radius: 4px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        /* Botões */
        .btn-group { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 4px; }
        .btn-group button { flex: 1; padding: 6px 2px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 9px; min-width: 35px; transition: 0.2s; }
        .btn-group button:hover { opacity: 0.8; transform: scale(0.97); }
        .btn-secondary { background: #2196F3; color: white; }
        .btn-primary { background: #ff5722; color: white; }
        .btn-success { background: #4CAF50; color: white; }
        .btn-info { background: #9C27B0; color: white; }
        .btn-danger { background: #f44336; color: white; }
        .btn-warning { background: #FF9800; color: white; }
        .btn-gold { background: #FFD700; color: #000; }
        .btn-voice { background: #E91E63; color: white; }
        .btn-whats { background: #25D366; color: white; }
        .btn-dark { background: #333; color: white; }
        
        /* Lista */
        .lista-container { background: #111; border-radius: 10px; padding: 8px; min-height: 150px; }
        .lista-container h2 { font-size: 12px; margin-bottom: 6px; color: #888; }
        .lista-entregas { list-style: none; padding: 0; max-height: 250px; overflow-y: auto; }
        .item-entrega { display: flex; justify-content: space-between; align-items: center; padding: 5px 8px; background: #1a1a1a; margin-bottom: 2px; border-radius: 4px; border-left: 3px solid #ff6b35; }
        .item-entrega .info .rua { font-weight: bold; font-size: 11px; color: #fff; }
        .item-entrega .info .numero { font-size: 10px; color: #888; }
        .item-entrega .info .cliente-info { font-size: 9px; color: #66bb6a; display: block; }
        .item-entrega .botoes { display: flex; gap: 3px; }
        .item-entrega .botoes button { background: none; border: none; cursor: pointer; font-size: 14px; padding: 2px 3px; }
        .btn-delete { color: #f44336; }
        .btn-concluir { color: #4CAF50; }
        
        /* Rota Info */
        .rota-info { background: #111; padding: 8px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #1a1a1a; display: none; }
        .rota-info .info-row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 11px; border-bottom: 1px solid #1a1a1a; }
        .rota-info .info-row:last-child { border-bottom: none; }
        .rota-info .label { color: #666; }
        .rota-info .value { color: #ffd700; font-weight: bold; }
        .rota-info .value.entregas { color: #4CAF50; }
        .rota-info .value.voltas { color: #ff6b35; }
        
        /* Mapa */
        #mapaContainer { margin-top: 8px; background: #111; border-radius: 10px; overflow: hidden; padding: 8px; display: none; }
        #mapa { border-radius: 6px; min-height: 250px; width: 100%; }
        .btn-close { margin-top: 4px; padding: 6px; width: 100%; background: #222; border: none; border-radius: 4px; color: #fff; cursor: pointer; font-size: 11px; }
        
        /* Modal Histórico */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; padding: 10px; overflow-y: auto; }
        .modal-content { background: #0a0a0a; border-radius: 12px; max-width: 500px; margin: 10px auto; padding: 12px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #1a1a1a; }
        .modal-header h2 { font-size: 14px; color: #fff; }
        .modal-close { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
        .filtros { display: flex; gap: 3px; margin-bottom: 8px; flex-wrap: wrap; }
        .filtro-btn { padding: 3px 10px; background: #1a1a1a; border: none; border-radius: 16px; color: #666; cursor: pointer; font-size: 10px; }
        .filtro-btn.active { background: #ff6b35; color: #fff; }
        .resumo-historico { background: #111; padding: 8px; border-radius: 6px; margin-bottom: 8px; font-size: 11px; color: #888; line-height: 1.6; }
        .lista-historico { list-style: none; padding: 0; max-height: 200px; overflow-y: auto; }
        .item-historico { display: flex; justify-content: space-between; padding: 5px 8px; background: #111; margin-bottom: 2px; border-radius: 4px; font-size: 11px; border-left: 2px solid #4CAF50; }
        .item-historico .data-hora { color: #666; font-size: 9px; }
        .btn-exportar, .btn-backup { width: 100%; padding: 6px; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; margin-top: 3px; font-size: 11px; }
        .btn-exportar { background: #4CAF50; }
        .btn-backup { background: #2196F3; }
        
        /* WhatsApp e Voice */
        .btn-group-extra { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 4px; }
        .btn-group-extra button { flex: 1; padding: 6px 2px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 9px; min-width: 35px; transition: 0.2s; }
        .btn-group-extra button:hover { opacity: 0.8; }
        
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        
        .empty-state { text-align: center; color: #444; padding: 15px; font-size: 12px; }
        .empty-state .emoji { font-size: 30px; display: block; margin-bottom: 4px; }
        
        /* Responsivo */
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: repeat(3, 1fr); }
            .stat-number { font-size: 16px; }
            .btn-group button { font-size: 8px; padding: 5px 1px; }
            .btn-group-extra button { font-size: 8px; padding: 5px 1px; }
            .container { padding: 6px; }
        }
        
        /* Toast de voz */
        .voice-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a1a;
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid #ff6b35;
            font-size: 14px;
            z-index: 9999;
            display: none;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        .voice-toast.active {
            display: block;
            animation: fadeInUp 0.3s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚴 Entregas Camaquã</h1>
            <span class="status online" id="status">🟢 Online</span>
        </header>

        <!-- Ponto de Partida (Lanchonete) -->
        <div class="ponto-partida">
            <label>🏠 Ponto de Partida (Lanchonete)</label>
            <div class="input-row">
                <input type="text" id="pontoPartida" placeholder="Ex: Rua Bento Gonçalves, 123" value="Rua Bento Gonçalves, Camaquã RS">
                <button id="btnSalvarPonto" class="btn-set">Salvar</button>
            </div>
        </div>

        <div class="total-ganho">
            💰 Total ganho: <span id="totalGanho">R$ 0,00</span>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><span class="stat-number" id="totalHoje">0</span><span class="stat-label">Hoje</span></div>
            <div class="stat-card"><span class="stat-number" id="totalSemana">0</span><span class="stat-label">Semana</span></div>
            <div class="stat-card"><span class="stat-number" id="totalGeral">0</span><span class="stat-label">Total</span></div>
        </div>

        <!-- Informações da Rota -->
        <div class="rota-info" id="rotaInfo">
            <div class="info-row"><span class="label">🏠 Lanchonete:</span><span class="value" id="rotaPartida">-</span></div>
            <div class="info-row"><span class="label">📦 Entregas:</span><span class="value entregas" id="rotaEntregas">0</span></div>
            <div class="info-row"><span class="label">🔄 Voltas ao lanche:</span><span class="value voltas" id="rotaVoltas">0</span></div>
            <div class="info-row"><span class="label">📏 Distância total:</span><span class="value" id="rotaDistancia">-</span></div>
            <div class="info-row"><span class="label">⏱️ Tempo estimado:</span><span class="value" id="rotaTempo">-</span></div>
            <div class="info-row"><span class="label">📋 Ordem:</span><span class="value" id="rotaOrdem" style="font-size:10px;">-</span></div>
        </div>

        <!-- Formulário -->
        <div class="form-group">
            <div class="input-row">
                <input type="text" id="rua" placeholder="Rua" class="input-rua">
                <input type="number" id="numero" placeholder="Nº" class="input-numero">
                <input type="text" id="cliente" placeholder="Cliente" class="input-cliente">
                <button id="btnAdicionar" class="btn-add">+</button>
            </div>
            <div class="input-row">
                <input type="text" id="obs" placeholder="Obs" class="input-rua">
                <input type="number" id="valor" placeholder="R$" class="input-valor" step="0.01">
            </div>
            <div class="btn-group">
                <button id="btnOrdenar" class="btn-secondary">🔄 Ordenar</button>
                <button id="btnOtimizarRota" class="btn-gold">⚡ Otimizar</button>
                <button id="btnAgrupar" class="btn-info">📊 Agrupar</button>
                <button id="btnConcluir" class="btn-success">✅ Uma</button>
                <button id="btnConcluirTudo" class="btn-warning">✅ Tudo</button>
            </div>
            <div class="btn-group-extra">
                <button id="btnWhatsApp" class="btn-whats">💬 WhatsApp</button>
                <button id="btnVoice" class="btn-voice">🔊 Voz</button>
                <button id="btnDarkMode" class="btn-dark">🌙 Modo</button>
                <button id="btnHistorico" class="btn-info">📋 Hist</button>
                <button id="btnLimpar" class="btn-danger">🗑️</button>
            </div>
        </div>

        <!-- Lista -->
        <div class="lista-container">
            <h2>📦 Entregas do dia (<span id="total">0</span>)</h2>
            <ul id="listaEntregas" class="lista-entregas"></ul>
        </div>

        <!-- Mapa -->
        <div id="mapaContainer">
            <div id="mapa"></div>
            <button id="fecharMapa" class="btn-close">✕ Fechar Mapa</button>
        </div>

        <!-- Histórico -->
        <div id="historicoModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>📋 Histórico</h2>
                    <button class="modal-close" id="fecharHistorico">✕</button>
                </div>
                <div class="modal-body">
                    <div class="filtros">
                        <button class="filtro-btn active" data-filtro="hoje">Hoje</button>
                        <button class="filtro-btn" data-filtro="semana">Semana</button>
                        <button class="filtro-btn" data-filtro="mes">Mês</button>
                        <button class="filtro-btn" data-filtro="todos">Todos</button>
                    </div>
                    <div id="resumoHistorico" class="resumo-historico"></div>
                    <ul id="listaHistorico" class="lista-historico"></ul>
                    <button id="btnExportar" class="btn-exportar">📤 Exportar</button>
                    <button id="btnBackup" class="btn-backup" style="margin-top:4px;">💾 Backup</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast de voz -->
    <div class="voice-toast" id="voiceToast"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ==================== APP COMPLETO PREMIUM ====================
        console.log('🚴 App Premium - Otimizado para lanchonete');

        let entregas = [];
        let historico = [];
        let totalGanho = 0;
        let pontoPartida = 'Rua Bento Gonçalves, Camaquã RS';
        let coordenadasPartida = null;
        let coordenadasEntregas = [];
        let darkMode = false;
        let utterance = null;
        let vozAtiva = true;

        // ==================== DADOS ====================
        function carregarDados() {
            try {
                const e = localStorage.getItem('entregas_camagua');
                const h = localStorage.getItem('historico_camagua');
                const g = localStorage.getItem('totalGanho_camagua');
                const p = localStorage.getItem('pontoPartida_camagua');
                const d = localStorage.getItem('darkMode_camagua');
                if (e) entregas = JSON.parse(e);
                if (h) historico = JSON.parse(h);
                if (g) totalGanho = parseFloat(g) || 0;
                if (p) pontoPartida = p;
                if (d) darkMode = d === 'true';
                document.getElementById('pontoPartida').value = pontoPartida;
                if (darkMode) document.body.classList.add('dark-mode');
            } catch(e) { 
                entregas = []; 
                historico = []; 
                totalGanho = 0; 
            }
        }

        function salvarDados() {
            try {
                localStorage.setItem('entregas_camagua', JSON.stringify(entregas));
                localStorage.setItem('historico_camagua', JSON.stringify(historico));
                localStorage.setItem('totalGanho_camagua', String(totalGanho));
                localStorage.setItem('pontoPartida_camagua', pontoPartida);
                localStorage.setItem('darkMode_camagua', String(darkMode));
                atualizarTudo();
                return true;
            } catch(e) { 
                console.error('Erro:', e);
                return false;
            }
        }

        function atualizarTudo() {
            atualizarLista();
            calcularEstatisticas();
        }

        // ==================== ESTATÍSTICAS ====================
        function calcularEstatisticas() {
            const hoje = new Date(); hoje.setHours(0,0,0,0);
            const semana = new Date(hoje); semana.setDate(hoje.getDate() - 7);
            
            const hHoje = historico.filter(h => new Date(h.data) >= hoje);
            const hSemana = historico.filter(h => new Date(h.data) >= semana);
            
            document.getElementById('totalHoje').textContent = hHoje.length;
            document.getElementById('totalSemana').textContent = hSemana.length;
            document.getElementById('totalGeral').textContent = historico.length;
            document.getElementById('totalGanho').textContent = `R$ ${totalGanho.toFixed(2)}`;
        }

        // ==================== ADICIONAR ====================
        function adicionarEntrega() {
            const rua = document.getElementById('rua').value.trim();
            const numero = parseInt(document.getElementById('numero').value);
            const cliente = document.getElementById('cliente').value.trim();
            const obs = document.getElementById('obs').value.trim();
            const valor = parseFloat(document.getElementById('valor').value) || 0;

            if (!rua || !numero || numero <= 0) {
                alert('⚠️ Preencha RUA e NÚMERO!');
                return;
            }

            entregas.push({ rua, numero, cliente: cliente || '--', obs: obs || '--', valor });
            
            document.getElementById('rua').value = '';
            document.getElementById('numero').value = '';
            document.getElementById('cliente').value = '';
            document.getElementById('obs').value = '';
            document.getElementById('valor').value = '';
            
            salvarDados();
            falar(`Adicionado ${rua}, número ${numero}`);
            document.getElementById('rua').focus();
            document.getElementById('rotaInfo').style.display = 'none';
        }

        // ==================== CONCLUIR ====================
        function concluirEntrega(index) {
            if (index < 0 || index >= entregas.length) return;
            const entrega = entregas[index];
            const agora = new Date();
            const dataHora = agora.toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
            
            historico.push({
                rua: entrega.rua, numero: entrega.numero, cliente: entrega.cliente || '--',
                obs: entrega.obs || '--', valor: entrega.valor || 0,
                data: agora.toISOString(), dataHora: dataHora, timestamp: agora.getTime()
            });
            
            if (entrega.valor > 0) totalGanho += entrega.valor;
            entregas.splice(index, 1);
            salvarDados();
            falar(`Entrega concluída: ${entrega.rua}, número ${entrega.numero}`);
        }

        // ==================== RENDERIZAR LISTA ====================
        function atualizarLista() {
            const ul = document.getElementById('listaEntregas');
            document.getElementById('total').textContent = entregas.length;

            if (entregas.length === 0) {
                ul.innerHTML = '<div class="empty-state"><span class="emoji">📭</span>Nenhuma entrega pendente</div>';
                return;
            }

            ul.innerHTML = '';
            entregas.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'item-entrega';
                li.innerHTML = `
                    <div class="info">
                        <span class="rua">${item.rua}</span>
                        <span class="numero">Nº ${item.numero}</span>
                        ${item.cliente && item.cliente !== '--' ? `<span class="cliente-info">👤 ${item.cliente}</span>` : ''}
                        ${item.obs && item.obs !== '--' ? `<span class="cliente-info" style="color:#ffd700;">📝 ${item.obs}</span>` : ''}
                        ${item.valor > 0 ? `<span class="cliente-info" style="color:#4CAF50;">💰 R$ ${item.valor.toFixed(2)}</span>` : ''}
                    </div>
                    <div class="botoes">
                        <button class="btn-concluir" data-index="${index}">✅</button>
                        <button class="btn-delete" data-index="${index}">✕</button>
                    </div>
                `;
                ul.appendChild(li);
            });

            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.onclick = function() {
                    const i = parseInt(this.dataset.index);
                    if (confirm('Remover?')) { entregas.splice(i, 1); salvarDados(); }
                };
            });

            document.querySelectorAll('.btn-concluir').forEach(btn => {
                btn.onclick = function() { concluirEntrega(parseInt(this.dataset.index)); };
            });
        }

        // ==================== ORDENAR ====================
        function ordenarEntregas() {
            if (entregas.length === 0) { mostrarNotificacao('⚠️ Nenhuma entrega'); return; }
            entregas.sort((a,b) => {
                const ra = a.rua.toLowerCase(), rb = b.rua.toLowerCase();
                return ra < rb ? -1 : ra > rb ? 1 : a.numero - b.numero;
            });
            salvarDados();
            mostrarNotificacao('🔄 Ordenado!');
        }

        // ==================== GEOCODIFICAÇÃO ====================
        async function geocodificar(endereco) {
            try {
                const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(endereco)}&format=json&limit=1`;
                const response = await fetch(url, {
                    headers: { 'User-Agent': 'EntregasApp/1.0' }
                });
                const data = await response.json();
                if (data && data.length > 0) {
                    return {
                        lat: parseFloat(data[0].lat),
                        lng: parseFloat(data[0].lon)
                    };
                }
            } catch(e) {
                console.error('Erro geocodificação:', e);
            }
            return null;
        }

        // ==================== CALCULAR DISTÂNCIA ====================
        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // ==================== AGRUPAR POR REGIÃO ====================
        function agruparPorRegiao() {
            if (entregas.length === 0) {
                mostrarNotificacao('⚠️ Nenhuma entrega para agrupar');
                return;
            }

            const grupos = [];
            const visitados = new Set();

            for (let i = 0; i < entregas.length; i++) {
                if (visitados.has(i)) continue;
                
                const grupo = [i];
                visitados.add(i);
                
                for (let j = i + 1; j < entregas.length; j++) {
                    if (visitados.has(j)) continue;
                    
                    const rua1 = entregas[i].rua.toLowerCase();
                    const rua2 = entregas[j].rua.toLowerCase();
                    const palavras1 = rua1.split(' ');
                    const palavras2 = rua2.split(' ');
                    
                    let similar = false;
                    for (const p1 of palavras1) {
                        if (p1.length > 3 && palavras2.some(p2 => p2.includes(p1) || p1.includes(p2))) {
                            similar = true;
                            break;
                        }
                    }
                    
                    if (similar) {
                        grupo.push(j);
                        visitados.add(j);
                    }
                }
                grupos.push(grupo);
            }

            // Mostrar resultado
            let msg = `📊 ${grupos.length} grupos de entregas:\n\n`;
            grupos.forEach((g, i) => {
                msg += `Grupo ${i+1} (${g.length} entregas):\n`;
                g.forEach(idx => {
                    msg += `   • ${entregas[idx].rua}, ${entregas[idx].numero}\n`;
                });
                msg += '\n';
            });
            
            falar(`Encontrados ${grupos.length} grupos de entregas`);
            alert(msg);
            return grupos;
        }

        // ==================== OTIMIZAR ROTA (IDA E VOLTA) ====================
        async function otimizarRotaCompleta() {
            if (entregas.length === 0) {
                mostrarNotificacao('⚠️ Adicione entregas primeiro!');
                return;
            }

            mostrarNotificacao('⏳ Calculando rota otimizada...');
            falar('Calculando rota otimizada');

            // 1. Geocodificar ponto de partida
            if (!coordenadasPartida) {
                const coord = await geocodificar(pontoPartida);
                if (coord) {
                    coordenadasPartida = coord;
                } else {
                    coordenadasPartida = { lat: -30.8531, lng: -51.8125 };
                }
            }

            // 2. Geocodificar todas as entregas
            coordenadasEntregas = [];
            for (const entrega of entregas) {
                const endereco = `${entrega.rua}, ${entrega.numero}, Camaquã RS`;
                const coord = await geocodificar(endereco);
                if (coord) {
                    coordenadasEntregas.push({
                        ...coord,
                        rua: entrega.rua,
                        numero: entrega.numero,
                        cliente: entrega.cliente,
                        obs: entrega.obs,
                        valor: entrega.valor
                    });
                }
            }

            if (coordenadasEntregas.length === 0) {
                mostrarNotificacao('⚠️ Nenhum endereço encontrado!');
                return;
            }

            // 3. Otimizar rota com ida e volta
            const resultado = otimizarIdaVolta(coordenadasPartida, coordenadasEntregas);

            // 4. Reordenar entregas
            const novasEntregas = [];
            const ordemTexto = [];
            resultado.ordem.forEach((idx, pos) => {
                const entrega = entregas[idx];
                novasEntregas.push(entrega);
                ordemTexto.push(`#${pos+1}: ${entrega.rua}, ${entrega.numero}`);
            });

            entregas = novasEntregas;
            salvarDados();

            // 5. Mostrar informações
            const rotaInfo = document.getElementById('rotaInfo');
            rotaInfo.style.display = 'block';
            document.getElementById('rotaPartida').textContent = pontoPartida.substring(0, 25) + '...';
            document.getElementById('rotaEntregas').textContent = resultado.ordem.length;
            document.getElementById('rotaVoltas').textContent = resultado.voltas.length;
            document.getElementById('rotaDistancia').textContent = `${resultado.distanciaTotal.toFixed(2)} km`;
            
            const tempoEstimado = (resultado.distanciaTotal / 20) * 60;
            document.getElementById('rotaTempo').textContent = `${Math.floor(tempoEstimado)} min (~${Math.round(resultado.distanciaTotal / 20 * 60 / resultado.voltas.length || 1)} min/volta)`;
            
            let ordemResumo = '';
            resultado.voltas.forEach((v, i) => {
                const entregaNomes = v.entregas.map(idx => `${entregas[idx]?.rua?.substring(0,15) || '?'}`).join(' → ');
                ordemResumo += `Volta ${i+1}: ${v.entregas.length} entregas (${v.distancia.toFixed(2)} km)\n`;
            });
            document.getElementById('rotaOrdem').textContent = ordemResumo.substring(0, 100) + (ordemResumo.length > 100 ? '...' : '');

            // 6. Mostrar no mapa
            await mostrarRotaOtimizada(resultado.pontos);

            // 7. Falar o resumo
            falar(`Rota otimizada com ${resultado.voltas.length} voltas ao lanche. Distância total de ${resultado.distanciaTotal.toFixed(1)} quilômetros.`);

            mostrarNotificacao('✅ Rota otimizada!');
        }

        // ==================== OTIMIZAR IDA E VOLTA ====================
        function otimizarIdaVolta(pontoPartida, destinos) {
            if (destinos.length === 0) return { ordem: [], distanciaTotal: 0, voltas: [], pontos: [pontoPartida] };
            if (destinos.length === 1) {
                const dist = calcularDistancia(pontoPartida.lat, pontoPartida.lng, destinos[0].lat, destinos[0].lng);
                const distVolta = calcularDistancia(destinos[0].lat, destinos[0].lng, pontoPartida.lat, pontoPartida.lng);
                return { 
                    ordem: [0], 
                    distanciaTotal: dist + distVolta, 
                    voltas: [{ entregas: [0], distancia: distVolta }],
                    pontos: [pontoPartida, destinos[0], pontoPartida]
                };
            }

            let naoVisitados = destinos.map((d, i) => i);
            let ordem = [];
            let voltas = [];
            let distanciaTotal = 0;
            let atual = pontoPartida;
            let viagemAtual = [];
            let pontosRota = [pontoPartida];

            while (naoVisitados.length > 0) {
                let maisProximo = null;
                let menorDistancia = Infinity;
                let indiceMaisProximo = -1;

                for (let i of naoVisitados) {
                    const dist = calcularDistancia(atual.lat, atual.lng, destinos[i].lat, destinos[i].lng);
                    if (dist < menorDistancia) {
                        menorDistancia = dist;
                        indiceMaisProximo = i;
                    }
                }

                if (indiceMaisProximo !== -1) {
                    viagemAtual.push(indiceMaisProximo);
                    distanciaTotal += menorDistancia;
                    atual = destinos[indiceMaisProximo];
                    pontosRota.push(atual);
                    naoVisitados = naoVisitados.filter(i => i !== indiceMaisProximo);

                    const distVolta = calcularDistancia(atual.lat, atual.lng, pontoPartida.lat, pontoPartida.lng);
                    
                    // Decidir se volta: se tiver 2 entregas OU distância > 3km OU for a última
                    if (viagemAtual.length >= 2 || distVolta > 3 || naoVisitados.length === 0) {
                        distanciaTotal += distVolta;
                        voltas.push({
                            entregas: [...viagemAtual],
                            distancia: distVolta,
                            pontoVolta: { lat: pontoPartida.lat, lng: pontoPartida.lng }
                        });
                        ordem.push(...viagemAtual);
                        pontosRota.push(pontoPartida);
                        viagemAtual = [];
                        atual = pontoPartida;
                    }
                }
            }

            return { ordem, distanciaTotal, voltas, pontos: pontosRota };
        }

        // ==================== MOSTRAR MAPA ====================
        async function mostrarRotaOtimizada(pontos) {
            const container = document.getElementById('mapaContainer');
            container.style.display = 'block';
            const mapaDiv = document.getElementById('mapa');
            mapaDiv.innerHTML = '';

            if (typeof L === 'undefined') {
                mostrarNotificacao('⚠️ Mapa não carregou');
                return;
            }

            const map = L.map('mapa').setView([-30.8531, -51.8125], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            // Ícones
            const iconePartida = L.divIcon({
                className: 'custom-div-icon',
                html: '<div style="background:#ff6b35;color:white;padding:4px 8px;border-radius:50%;font-weight:bold;border:2px solid white;font-size:12px;">🏠</div>',
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });

            const iconeVolta = L.divIcon({
                className: 'custom-div-icon',
                html: '<div style="background:#ff5722;color:white;padding:4px 8px;border-radius:50%;font-weight:bold;border:2px solid white;font-size:10px;">🔄</div>',
                iconSize: [25, 25],
                iconAnchor: [12, 12]
            });

            // Marcar pontos
            let entregaIndex = 1;
            let voltaIndex = 0;
            let voltas = [];
            
            // Extrair voltas do array de pontos
            for (let i = 0; i < pontos.length; i++) {
                const p = pontos[i];
                const isPartida = i === 0 || (i > 0 && i < pontos.length - 1 && 
                    p.lat === pontos[0].lat && p.lng === pontos[0].lng);
                
                if (isPartida && i > 0) {
                    // É uma volta
                    voltaIndex++;
                    L.marker([p.lat, p.lng], { icon: iconeVolta })
                        .addTo(map)
                        .bindPopup(`🔄 Volta #${voltaIndex} ao lanche`);
                } else if (i === 0) {
                    L.marker([p.lat, p.lng], { icon: iconePartida })
                        .addTo(map)
                        .bindPopup(`🏠 Lanchonete<br>${pontoPartida}`);
                } else {
                    // É uma entrega
                    const entrega = entregas[entregaIndex - 1];
                    if (entrega) {
                        const cor = entregaIndex % 2 === 0 ? '#4CAF50' : '#ff6b35';
                        const icone = L.divIcon({
                            className: 'custom-div-icon',
                            html: `<div style="background:${cor};color:white;padding:3px 6px;border-radius:50%;font-weight:bold;border:2px solid white;font-size:10px;">${entregaIndex}</div>`,
                            iconSize: [22, 22],
                            iconAnchor: [11, 11]
                        });
                        L.marker([p.lat, p.lng], { icon: icone })
                            .addTo(map)
                            .bindPopup(`<b>#${entregaIndex}</b><br>📦 ${entrega.rua}, ${entrega.numero}${entrega.cliente && entrega.cliente !== '--' ? `<br>👤 ${entrega.cliente}` : ''}${entrega.valor > 0 ? `<br>💰 R$ ${entrega.valor.toFixed(2)}` : ''}`);
                        entregaIndex++;
                    }
                }
            }

            // Desenhar rotas (linhas)
            if (pontos.length > 1) {
                const latlngs = pontos.map(p => [p.lat, p.lng]);
                L.polyline(latlngs, {
                    color: '#ff5722',
                    weight: 4,
                    opacity: 0.8,
                    dashArray: '8, 6'
                }).addTo(map);

                const bounds = L.latLngBounds(latlngs);
                map.fitBounds(bounds, { padding: [40, 40] });
            }
        }

        // ==================== WHATSAPP ====================
        function compartilharWhatsApp() {
            if (entregas.length === 0) {
                mostrarNotificacao('⚠️ Nenhuma entrega para compartilhar');
                return;
            }

            let mensagem = `🚴 *ENTREGAS CAMAQUÃ*\n`;
            mensagem += `═`.repeat(30) + '\n\n';
            mensagem += `🏠 *Lanchonete:* ${pontoPartida.substring(0, 40)}\n`;
            mensagem += `📦 *Entregas:* ${entregas.length}\n\n`;
            mensagem += `📋 *Rota otimizada:*\n`;
            
            entregas.forEach((e, i) => {
                mensagem += `${i+1}. ${e.rua}, ${e.numero}`;
                if (e.cliente && e.cliente !== '--') mensagem += ` (${e.cliente})`;
                if (e.valor > 0) mensagem += ` - R$ ${e.valor.toFixed(2)}`;
                mensagem += '\n';
            });

            mensagem += `\n💰 *Total: R$ ${entregas.reduce((s,e) => s + e.valor, 0).toFixed(2)}*`;

            const url = `https://wa.me/?text=${encodeURIComponent(mensagem)}`;
            window.open(url, '_blank');
            falar('Compartilhando rota no WhatsApp');
        }

        // ==================== NAVEGAÇÃO POR VOZ ====================
        function falar(texto) {
            if (!vozAtiva) return;
            
            try {
                if (window.speechSynthesis) {
                    if (utterance) {
                        window.speechSynthesis.cancel();
                    }
                    utterance = new SpeechSynthesisUtterance(texto);
                    utterance.lang = 'pt-BR';
                    utterance.rate = 0.9;
                    utterance.pitch = 1;
                    utterance.volume = 1;
                    
                    // Mostrar no toast
                    const toast = document.getElementById('voiceToast');
                    toast.textContent = '🔊 ' + texto;
                    toast.classList.add('active');
                    setTimeout(() => toast.classList.remove('active'), 3000);
                    
                    window.speechSynthesis.speak(utterance);
                }
            } catch(e) {
                console.error('Erro na voz:', e);
            }
        }

        function alternarVoz() {
            vozAtiva = !vozAtiva;
            mostrarNotificacao(vozAtiva ? '🔊 Voz ativada' : '🔇 Voz desativada');
            if (vozAtiva) {
                falar('Voz ativada');
            }
        }

        // ==================== DARK MODE ====================
        function alternarDarkMode() {
            darkMode = !darkMode;
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode_camagua', String(darkMode));
            mostrarNotificacao(darkMode ? '🌙 Modo noturno ativado' : '☀️ Modo claro ativado');
        }

        // ==================== HISTÓRICO ====================
        function abrirHistorico(filtro = 'hoje') {
            document.getElementById('historicoModal').style.display = 'block';
            aplicarFiltro(filtro);
        }

        function aplicarFiltro(filtro) {
            const agora = new Date();
            let filtrados = [...historico];
            if (filtro === 'hoje') {
                const inicio = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
                filtrados = historico.filter(h => new Date(h.data) >= inicio);
            } else if (filtro === 'semana') {
                const inicio = new Date(agora); inicio.setDate(agora.getDate() - 7);
                filtrados = historico.filter(h => new Date(h.data) >= inicio);
            } else if (filtro === 'mes') {
                const inicio = new Date(agora.getFullYear(), agora.getMonth(), 1);
                filtrados = historico.filter(h => new Date(h.data) >= inicio);
            }
            filtrados.sort((a,b) => b.timestamp - a.timestamp);

            const totalValor = filtrados.reduce((s, h) => s + (h.valor || 0), 0);
            const ruas = {};
            filtrados.forEach(h => { ruas[h.rua] = (ruas[h.rua] || 0) + 1; });
            const top = Object.entries(ruas).sort((a,b) => b[1]-a[1]).slice(0,3).map(([r,c]) => `${r} (${c}x)`);

            document.getElementById('resumoHistorico').innerHTML = `
                <strong>📊 Resumo:</strong><br>
                Total: ${filtrados.length} entregas<br>
                💰 R$ ${totalValor.toFixed(2)}<br>
                Ruas: ${top.join(', ') || 'Nenhuma'}
            `;

            const lista = document.getElementById('listaHistorico');
            if (filtrados.length === 0) {
                lista.innerHTML = '<div class="empty-state">Nenhuma entrega</div>';
                return;
            }
            lista.innerHTML = '';
            filtrados.forEach(item => {
                const li = document.createElement('li');
                li.className = 'item-historico';
                li.innerHTML = `
                    <div><strong>${item.rua}</strong>, ${item.numero} ${item.cliente && item.cliente !== '--' ? '👤'+item.cliente : ''} ${item.valor > 0 ? '💰R$'+item.valor.toFixed(2) : ''}</div>
                    <div class="data-hora">${item.dataHora}</div>
                `;
                lista.appendChild(li);
            });
        }

        // ==================== EXPORTAR / BACKUP ====================
        function exportarRelatorio() {
            if (historico.length === 0) { alert('Sem histórico'); return; }
            const totalValor = historico.reduce((s,h) => s + (h.valor||0), 0);
            let rel = `🚴 RELATÓRIO - ${new Date().toLocaleDateString('pt-BR')}\n`;
            rel += `═`.repeat(40) + '\n';
            rel += `📦 Total: ${historico.length} entregas\n`;
            rel += `💰 Total: R$ ${totalValor.toFixed(2)}\n\n`;
            rel += `📋 Últimas:\n`;
            historico.slice(-5).reverse().forEach(h => {
                rel += `   • ${h.rua}, ${h.numero}`;
                if (h.valor > 0) rel += ` - R$ ${h.valor.toFixed(2)}`;
                rel += ` (${h.dataHora})\n`;
            });
            navigator.clipboard.writeText(rel).then(() => mostrarNotificacao('📤 Copiado!')).catch(() => alert(rel));
        }

        function fazerBackup() {
            const dados = { entregas, historico, totalGanho, pontoPartida, data: new Date().toISOString() };
            const blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `backup_${new Date().toLocaleDateString()}.json`;
            link.click();
            mostrarNotificacao('💾 Backup baixado!');
        }

        // ==================== NOTIFICAÇÕES ====================
        function mostrarNotificacao(msg) {
            const s = document.getElementById('status');
            const old = s.textContent;
            s.textContent = msg;
            s.style.background = '#1b5e20';
            s.style.color = '#81c784';
            setTimeout(() => { 
                s.textContent = old; 
                s.style.background = ''; 
                s.style.color = ''; 
            }, 3000);
        }

        // ==================== EVENTOS ====================
        document.addEventListener('DOMContentLoaded', function() {
            carregarDados();
            atualizarTudo();

            // Adicionar
            document.getElementById('btnAdicionar').onclick = adicionarEntrega;
            document.querySelectorAll('.input-rua, .input-numero, .input-cliente').forEach(input => {
                input.onkeypress = function(e) { if (e.key === 'Enter') adicionarEntrega(); };
            });

            // Salvar ponto
            document.getElementById('btnSalvarPonto').onclick = function() {
                const novoPonto = document.getElementById('pontoPartida').value.trim();
                if (novoPonto) {
                    pontoPartida = novoPonto;
                    coordenadasPartida = null;
                    localStorage.setItem('pontoPartida_camagua', pontoPartida);
                    mostrarNotificacao('📍 Ponto salvo!');
                    falar('Ponto de partida salvo');
                }
            };

            // Otimizar Rota
            document.getElementById('btnOtimizarRota').onclick = otimizarRotaCompleta;

            // Agrupar
            document.getElementById('btnAgrupar').onclick = agruparPorRegiao;

            // Ordenar
            document.getElementById('btnOrdenar').onclick = ordenarEntregas;

            // Concluir
            document.getElementById('btnConcluir').onclick = function() {
                if (entregas.length === 0) { mostrarNotificacao('⚠️ Nenhuma entrega'); return; }
                concluirEntrega(entregas.length - 1);
            };

            document.getElementById('btnConcluirTudo').onclick = function() {
                if (entregas.length === 0) { mostrarNotificacao('⚠️ Nenhuma entrega'); return; }
                if (confirm(`Concluir ${entregas.length} entregas?`)) {
                    while (entregas.length > 0) concluirEntrega(0);
                    mostrarNotificacao('✅ Todas concluídas!');
                }
            };

            // WhatsApp
            document.getElementById('btnWhatsApp').onclick = compartilharWhatsApp;

            // Voz
            document.getElementById('btnVoice').onclick = alternarVoz;

            // Dark Mode
            document.getElementById('btnDarkMode').onclick = alternarDarkMode;

            // Histórico
            document.getElementById('btnHistorico').onclick = function() { abrirHistorico('hoje'); };
            document.getElementById('btnLimpar').onclick = function() {
                if (entregas.length === 0) { mostrarNotificacao('⚠️ Nenhuma entrega'); return; }
                if (confirm('Remover todas?')) { entregas = []; salvarDados(); }
            };

            // Fechar mapa
            document.getElementById('fecharMapa').onclick = function() {
                document.getElementById('mapaContainer').style.display = 'none';
            };

            // Fechar histórico
            document.getElementById('fecharHistorico').onclick = function() {
                document.getElementById('historicoModal').style.display = 'none';
            };

            document.getElementById('historicoModal').onclick = function(e) {
                if (e.target === this) this.style.display = 'none';
            };

            document.getElementById('btnExportar').onclick = exportarRelatorio;
            document.getElementById('btnBackup').onclick = fazerBackup;

            // Filtros
            document.querySelectorAll('.filtro-btn').forEach(btn => {
                btn.onclick = function() {
                    document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    aplicarFiltro(this.dataset.filtro);
                };
            });

            // Adicionar exemplos
            if (entregas.length === 0 && historico.length === 0) {
                entregas = [
                    { rua: 'Bento Gonçalves', numero: 120, cliente: 'João', obs: 'AP 302', valor: 15 },
                    { rua: 'Andrade Neves', numero: 45, cliente: 'Maria', obs: 'Portão azul', valor: 12 },
                    { rua: 'Júlio de Castilhos', numero: 300, cliente: 'Carlos', obs: 'Casa amarela', valor: 18 },
                    { rua: 'Tiradentes', numero: 88, cliente: 'Ana', obs: '3º andar', valor: 10 }
                ];
                salvarDados();
            }

            console.log('✅ App Premium pronto!');
            console.log(`📦 ${entregas.length} entregas`);
            console.log(`🏠 Lanchonete: ${pontoPartida}`);
            falar('App de entregas Camaquã pronto para usar');
        });
